## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Tue Sep 16 16:00:40 PDT 2025
android.enableJetifier=true
android.useAndroidX=true


# --- Gradle JVM memory ---
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=35 -XX:SoftRefLRUPolicyMSPerMB=50 -XX:+HeapDumpOnOutOfMemoryError

# Use the Gradle daemon and cache
org.gradle.daemon=true
org.gradle.caching=true

# Parallel workers (tune this if your machine struggles)
org.gradle.parallel=true
# org.gradle.workers.max=4   # uncomment to cap workers on lower-RAM machines

# Kotlin compiler/daemon memory
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.jvm.target.validation.mode=warning
